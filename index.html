<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tri-Alliance Clash: Member Guide</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8eef0;--card:#fbfdfd;--text:#16222a;--muted:#55656e;--line:#9db0b8;--atk:#0b7a6a;--def:#c8332b;--mv:#1f5fd6;--hl:#f5b400;--ra:#c2410c;--rd:#1d4ed8;--rf:#7e22ce;--rl:#0f766e;--btn:#16222a;--btnt:#fbfdfd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181c;--card:#18242a;--text:#e6eef1;--muted:#93a6af;--line:#46606b;--atk:#2fe0c4;--def:#ff6b60;--mv:#7aa6ff;--ra:#fb923c;--rd:#60a5fa;--rf:#c084fc;--rl:#2dd4bf;--btn:#e6eef1;--btnt:#10181c}}
:root[data-theme="dark"]{--bg:#10181c;--card:#18242a;--text:#e6eef1;--muted:#93a6af;--line:#46606b;--atk:#2fe0c4;--def:#ff6b60;--mv:#7aa6ff;--ra:#fb923c;--rd:#60a5fa;--rf:#c084fc;--rl:#2dd4bf;--btn:#e6eef1;--btnt:#10181c}
html{height:100dvh;scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.sr{position:absolute;left:-9999px}
.top{display:flex;gap:8px;align-items:center;padding:6px 10px}
select{flex:1;min-width:0;font:600 16px system-ui,sans-serif;color:var(--text);padding:0 38px 0 12px;height:40px;border:1px solid var(--line);border-radius:12px;appearance:none;-webkit-appearance:none;background-color:var(--card);background-image:linear-gradient(45deg,transparent 50%,var(--text) 50%),linear-gradient(135deg,var(--text) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.locale{position:relative;flex:none}
.locale summary{position:relative;display:grid;place-items:center;width:40px;height:40px;list-style:none;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer}
.locale summary::-webkit-details-marker{display:none}
.locale summary:focus-visible,.locale-menu button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.locale summary svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.locale-code{position:absolute;right:-4px;bottom:-3px;padding:1px 3px;border:1px solid var(--card);border-radius:5px;background:var(--btn);color:var(--btnt);font:700 9px/1.2 system-ui,sans-serif}
.locale-menu{position:absolute;z-index:10;top:calc(100% + 6px);left:0;min-width:150px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.locale-menu button{display:block;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;font:500 14px system-ui,sans-serif}
.locale-menu button:hover,.locale-menu button[aria-pressed=true]{background:var(--btn);color:var(--btnt)}
.side{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);flex:none}
.side button{width:40px;height:38px;border:0;border-radius:0;background:transparent;color:var(--text);font:700 16px system-ui,sans-serif;padding:0;min-height:0}
@media (max-width:360px){.side button{width:32px}}
.side button[aria-pressed=true]{background:var(--btn);color:var(--btnt)}
button{font:600 16px system-ui,sans-serif;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.map{position:relative;flex:1 1 auto;min-height:150px;background:var(--line);touch-action:none;overflow:hidden;border-top:1px solid var(--line)}
svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.mc{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mc button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:700 20px/1 system-ui,sans-serif;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cr{position:absolute;left:8px;bottom:6px;font-size:11px;color:#1d2a30;background:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px;pointer-events:none}
.ring{fill:none;stroke:#0f172a;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
.reg{fill:#0f172a;fill-opacity:.12;stroke:#0f172a}
.ar{fill:none;stroke-linecap:round;stroke-linejoin:round}
.a-atk{stroke:#c2410c}.a-def{stroke:#1d4ed8}.a-flo{stroke:#7e22ce}.a-foe{stroke:#b91c1c}.a-mv,.a-bi{stroke:#334155}
.mk{fill:var(--card);stroke:#0f172a}
.mt{fill:var(--text);font-family:system-ui,sans-serif;font-weight:600;text-anchor:middle;dominant-baseline:central}
.sheet{flex:none;height:clamp(150px,27%,236px);background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.18);padding:8px 14px 4px;overflow:auto;overflow-x:hidden;touch-action:pan-y;position:relative;z-index:2}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh b{font:700 17px/1.25 Georgia,"Times New Roman",serif}.sh span{font-size:13px;color:var(--muted);white-space:nowrap}
.segrow{display:flex;align-items:center;gap:10px;margin:6px 0 8px}.segrow .seg{flex:1;margin:0}.seg{display:flex;gap:4px;margin:6px 0 8px}.plan{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}.plan button{min-height:0;height:26px;padding:0 9px;border:0;border-radius:0;background:transparent;color:var(--text);font:700 12px system-ui,sans-serif}.plan button[aria-pressed=true]{background:var(--btn);color:var(--btnt)}.plan[hidden]{display:none}.seg i{flex:1;height:6px;border-radius:3px;background:var(--line)}.seg i.on{background:var(--hl)}
.tx{font-size:18px;line-height:1.35}.tx div{margin:3px 0}.tx.job{border-left:4px solid var(--hl);padding-left:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.chips span{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}.chips span.n{border:0;padding:0}
.hint{font-size:13px;color:var(--muted);margin-top:10px}
.bar{flex:none;display:flex;gap:10px;padding:6px 12px 8px;background:var(--card)}
.bar button{height:48px;border-radius:14px;border:1px solid var(--btn);font-size:17px}
#prev{flex:1;background:transparent;color:var(--text)}#next{flex:2;background:var(--btn);color:var(--btnt)}
.bar button:disabled{opacity:.3}
.role{--c:var(--ra);display:inline-flex;align-items:center;gap:6px;font:700 16px/1.3 system-ui,sans-serif;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1.5px solid var(--c);border-radius:999px;padding:1px 9px 1px 8px;cursor:help;vertical-align:baseline}
.role::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.role::after{content:"i";font:700 10px/12px Georgia,serif;width:13px;height:13px;text-align:center;border:1.5px solid var(--c);border-radius:50%;opacity:.75}
.role:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.rA{--c:var(--ra)}.rD{--c:var(--rd)}.rF{--c:var(--rf)}.rL{--c:var(--rl)}.chips .role{font-size:14px}
.tip{position:fixed;z-index:50;max-width:250px;background:var(--btn);color:var(--btnt);padding:9px 12px;border-radius:8px;font:500 14px/1.35 system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.28);pointer-events:none}
.tip::after{content:"";position:absolute;left:var(--ax,50%);width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg)}.tip.up::after{bottom:-5px}.tip.dn::after{top:-5px}.tip[hidden]{display:none}
.sh #col{width:30px;height:26px;min-height:0;padding:0;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font:700 16px/1 system-ui,sans-serif;margin-left:auto}
.sh #col svg{ width:8px;height:8px;fill:white;margin:0 auto;display:block}
.sh #col[aria-expanded=false] svg{transform:rotate(180deg)}
.sh span{margin-left:auto}.sh #col{margin-left:8px}
.sheet.min{height:auto}.sheet.min .tx,.sheet.min #v,.sheet.min .hint{display:none}
.node{font:inherit;font-weight:700;color:var(--text);background:color-mix(in srgb,var(--hl) 30%,transparent);border:0;border-bottom:2px dotted var(--hl);border-radius:5px;padding:0 4px;cursor:zoom-in;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.node:active,.node.on{background:color-mix(in srgb,var(--hl) 60%,transparent)}
@media (min-width:600px){.tx{font-size:19px}}
</style>
</head>

["Three sides, one Temple in the middle.","Üç taraf, ortada tek bir Tapınak.","Três lados, um Templo no meio.","สามฝ่าย วิหารหนึ่งแห่งตรงกลาง","세 진영, 중앙에 하나의 사원.","Trzy strony, jedna Świątynia pośrodku.","Tre sider, ett tempel i midten.","Trois camps, un Temple au milieu."],
["We play side {X}. Switch sides above the map.","{X} tarafında oynuyoruz. Haritanın üstünden tarafı değiştirin.","Jogamos pelo lado {X}. Troque de lado acima do mapa.","เราเล่นฝั่ง {X} เปลี่ยนฝั่งได้เหนือแผนที่","우리는 {X} 진영으로 플레이합니다. 지도 위에서 진영을 바꾸세요.","Gramy po stronie {X}. Zmień stronę nad mapą.","Vi spiller på side {X}. Bytt side over kartet.","Nous jouons du côté {X}. Changez de camp au-dessus de la carte."],
["The other two sides are {Y} and {Z}.","Diğer iki taraf {Y} ve {Z}.","Os outros dois lados são {Y} e {Z}.","อีกสองฝ่ายคือ {Y} และ {Z}","나머지 두 진영은 {Y}와 {Z}입니다.","Dwie pozostałe strony to {Y} i {Z}.","De to andre sidene er {Y} og {Z}.","Les deux autres camps sont {Y} et {Z}."],
["Garrisons sit closer to one neighbor than the other, so fights naturally rotate this way.","Garnizonlar komşulardan birine daha yakındır; bu yüzden çatışmalar doğal olarak bu yönde döner.","As guarnições ficam mais perto de um vizinho do que do outro, então as lutas tendem a girar nesta direção.","กองรักษาการณ์อยู่ใกล้เพื่อนบ้านฝ่ายหนึ่งมากกว่า การต่อสู้จึงมักหมุนเวียนไปตามทิศนี้","주둔지는 한쪽 이웃 진영에 더 가까워서 전투가 자연스럽게 이 방향으로 순환합니다.","Garnizony leżą bliżej jednego sąsiada niż drugiego, dlatego walki naturalnie toczą się w tym kierunku.","Garnisonene ligger nærmere den ene naboen enn den andre, så kampene roterer naturlig i denne retningen.","Les garnisons sont plus proches d’un voisin que de l’autre, les combats tournent donc naturellement dans cette direction."],
["You get one role, set by [Leader] before the battle. All 3 of your marches follow it.","Savaştan önce [Leader] tarafından belirlenen tek bir rol alırsınız. Üç seferiniz de bu rolü izler.","Você recebe uma função definida pelo [Leader] antes da batalha. Suas 3 marchas seguem essa função.","ก่อนเริ่มการต่อสู้ [Leader] จะกำหนดบทบาทให้คุณหนึ่งบทบาท กองทัพทั้ง 3 ของคุณจะใช้บทบาทนั้น","전투 전에 [Leader]가 역할 하나를 지정합니다. 행군 3개 모두 해당 역할을 따릅니다.","Przed bitwą [Leader] przydzieli ci jedną rolę. Wszystkie 3 twoje marsze będą ją realizować.","[Leader] gir deg én rolle før kampen. Alle de 3 marsjene dine følger den.","[Leader] vous attribue un rôle avant le combat. Vos 3 marches suivent ce rôle."],
["HQ ({X}1): where we start. 1,800 points per minute.","Karargâh ({X}1): başlangıç noktamız. Dakikada 1.800 puan.","QG ({X}1): onde começamos. 1.800 pontos por minuto.","กองบัญชาการ ({X}1): จุดเริ่มต้นของเรา 1,800 คะแนนต่อนาที","본부 ({X}1): 시작 지점입니다. 분당 1,800점.","Kwatera główna ({X}1): nasz punkt startowy. 1800 punktów na minutę.","Hovedkvarter ({X}1): her starter vi. 1 800 poeng i minuttet.","QG ({X}1) : notre point de départ. 1 800 points par minute."],
["Garrison ({X}24): 1,800 points per minute. Opens at 20:00.","Garnizon ({X}24): dakikada 1.800 puan. 20:00'de açılır.","Guarnição ({X}24): 1.800 pontos por minuto. Abre às 20:00.","กองรักษาการณ์ ({X}24): 1,800 คะแนนต่อนาที เปิดเวลา 20:00","주둔지 ({X}24): 분당 1,800점. 20:00에 열립니다.","Garnizon ({X}24): 1800 punktów na minutę. Otwiera się o 20:00.","Garnison ({X}24): 1 800 poeng i minuttet. Åpner kl. 20:00.","Garnison ({X}24) : 1 800 points par minute. Ouverture à 20:00."],
["The captain of a building recovers energy faster.","Bir binanın kaptanı enerjisini daha hızlı yeniler.","O capitão de uma construção recupera energia mais rápido.","กัปตันของอาคารจะฟื้นฟูพลังงานเร็วขึ้น","건물의 대장은 에너지를 더 빨리 회복합니다.","Dowódca budynku szybciej odzyskuje energię.","En bygningens kaptein gjenvinner energi raskere.","Le capitaine d’un bâtiment récupère de l’énergie plus rapidement."],
["Clusters of Ruins: 600 points per minute each.","Harabe kümeleri: her biri dakikada 600 puan.","Conjuntos de Ruínas: 600 pontos por minuto cada.","กลุ่มซากปรักหักพัง: แห่งละ 600 คะแนนต่อนาที","폐허 군집: 각 분당 600점.","Skupiska Ruin: po 600 punktów na minutę.","Ruinområder: 600 poeng i minuttet hver.","Groupes de ruines : 600 points par minute chacun."],
["Ruins: 180 points per minute each.","Harabeler: her biri dakikada 180 puan.","Ruínas: 180 pontos por minuto cada.","ซากปรักหักพัง: แห่งละ 180 คะแนนต่อนาที","폐허: 각각 분당 180점.","Ruiny: po 180 punktów na minutę.","Ruiner: 180 poeng i minuttet hver.","Ruines : 180 points par minute chacune."],
["Transit Hubs: 60 points per minute each. They are the gates between sides.","Geçiş merkezleri: her biri dakikada 60 puan. Taraflar arasındaki kapılardır.","Centros de trânsito: 60 pontos por minuto cada. São os portões entre os lados.","ศูนย์เปลี่ยนผ่าน: แห่งละ 60 คะแนนต่อนาที เป็นประตูเชื่อมระหว่างฝ่าย","환승 거점: 각각 분당 60점. 진영 사이를 잇는 관문입니다.","Węzły tranzytowe: po 60 punktów na minutę. To bramy między stronami.","Transittknutepunkter: 60 poeng i minuttet hver. De er portene mellom sidene.","Carrefours de transit : 60 points par minute chacun. Ce sont les portes entre les camps."],
["The captain of a building recovers energy faster. [Leader] appoint captains.","Bir binanın kaptanı enerjisini daha hızlı yeniler. Kaptanları [Leader] atar.","O capitão de uma construção recupera energia mais rápido. O [Leader] nomeia os capitães.","กัปตันของอาคารจะฟื้นฟูพลังงานเร็วขึ้น [Leader] เป็นผู้แต่งตั้งกัปตัน","건물의 대장은 에너지를 더 빨리 회복합니다. [Leader]가 대장을 지정합니다.","Dowódca budynku szybciej odzyskuje energię. [Leader] wyznacza dowódców.","En bygningens kaptein gjenvinner energi raskere. [Leader] utnevner kapteiner.","Le capitaine d’un bâtiment récupère de l’énergie plus rapidement. [Leader] nomme les capitaines."],
["Each side has 6 hubs. They are the only way into another side.","Her tarafta 6 merkez vardır. Başka bir tarafa geçmenin tek yolu bunlardır.","Cada lado tem 6 centros. Eles são o único caminho para outro lado.","แต่ละฝ่ายมีศูนย์ 6 แห่ง เป็นทางเดียวที่จะเข้าสู่ฝ่ายอื่น","각 진영에는 거점이 6개 있습니다. 다른 진영으로 가는 유일한 경로입니다.","Każda strona ma 6 węzłów. To jedyna droga na terytorium innej strony.","Hver side har 6 knutepunkter. De er den eneste veien til en annen side.","Chaque camp possède 6 carrefours. C’est le seul moyen d’accéder aux autres camps."],
["{X}18, {X}27 and {X}31 lead to side {Y}.","{X}18, {X}27 ve {X}31, {Y} tarafına çıkar.","{X}18, {X}27 e {X}31 levam ao lado {Y}.","{X}18, {X}27 และ {X}31 ไปยังฝั่ง {Y}","{X}18, {X}27, {X}31은 {Y} 진영으로 이어집니다.","{X}18, {X}27 i {X}31 prowadzą na stronę {Y}.","{X}18, {X}27 og {X}31 fører til side {Y}.","{X}18, {X}27 et {X}31 mènent au camp {Y}."],
["{X}19, {X}28 and {X}30 lead to side {Z}.","{X}19, {X}28 ve {X}30, {Z} tarafına çıkar.","{X}19, {X}28 e {X}30 levam ao lado {Z}.","{X}19, {X}28 และ {X}30 ไปยังฝั่ง {Z}","{X}19, {X}28, {X}30은 {Z} 진영으로 이어집니다.","{X}19, {X}28 i {X}30 prowadzą na stronę {Z}.","{X}19, {X}28 og {X}30 fører til side {Z}.","{X}19, {X}28 et {X}30 mènent au camp {Z}."],
["{X}30 and {X}31 also lead to the Temple.","{X}30 ve {X}31 ayrıca Tapınak'a çıkar.","{X}30 e {X}31 também levam ao Templo.","{X}30 และ {X}31 ยังไปยังวิหารได้ด้วย","{X}30과 {X}31도 사원으로 이어집니다.","{X}30 i {X}31 prowadzą także do Świątyni.","{X}30 og {X}31 fører også til tempelet.","{X}30 et {X}31 mènent aussi au Temple."],
["{X}28 is behind our Garrison, so it is locked at first.","{X}28 garnizonumuzun arkasındadır, bu yüzden başlangıçta kilitlidir.","{X}28 fica atrás da nossa Guarnição, então começa bloqueado.","{X}28 อยู่หลังกองรักษาการณ์ของเรา จึงถูกล็อกในช่วงแรก","{X}28은 우리 주둔지 뒤에 있어 처음에는 잠겨 있습니다.","{X}28 znajduje się za naszym Garnizonem, dlatego początkowo jest zablokowany.","{X}28 ligger bak garnisonen vår og er derfor låst i starten.","{X}28 se trouve derrière notre Garnison et est donc verrouillé au début."],
["Garrisons and the hub behind them are blocked until 20:00.","Garnizonlar ve arkalarındaki merkez 20:00'ye kadar kapalıdır.","As guarnições e o centro atrás delas ficam bloqueados até 20:00.","กองรักษาการณ์และศูนย์ที่อยู่ด้านหลังถูกปิดกั้นจนถึง 20:00","주둔지와 그 뒤의 거점은 20:00까지 막혀 있습니다.","Garnizony i znajdujący się za nimi węzeł są zablokowane do 20:00.","Garnisonene og knutepunktet bak dem er blokkert til kl. 20:00.","Les garnisons et le carrefour situé derrière elles sont bloqués jusqu’à 20:00."],
["Until then, sides meet at 4 hubs: {X}18, {X}19, {X}30 and {X}31.","O zamana kadar taraflar 4 merkezde karşılaşır: {X}18, {X}19, {X}30 ve {X}31.","Até lá, os lados se encontram em 4 centros: {X}18, {X}19, {X}30 e {X}31.","ระหว่างนั้นแต่ละฝ่ายจะปะทะกันที่ 4 ศูนย์: {X}18, {X}19, {X}30 และ {X}31","그때까지 진영들은 거점 4곳에서 맞붙습니다: {X}18, {X}19, {X}30, {X}31.","Do tego czasu strony spotykają się przy 4 węzłach: {X}18, {X}19, {X}30 i {X}31.","Frem til da møtes sidene ved 4 knutepunkter: {X}18, {X}19, {X}30 og {X}31.","D’ici là, les camps se rencontrent à 4 carrefours : {X}18, {X}19, {X}30 et {X}31."],
["Your job: early fights are at those 4 hubs.","Göreviniz: ilk çatışmalar bu 4 merkezde olacak.","Sua tarefa: as primeiras lutas acontecem nesses 4 centros.","หน้าที่ของคุณ: การต่อสู้ช่วงแรกจะเกิดขึ้นที่ 4 ศูนย์นี้","임무: 초반 전투는 이 거점 4곳에서 벌어집니다.","Twoje zadanie: pierwsze walki odbędą się przy tych 4 węzłach.","Din oppgave: de første kampene foregår ved disse 4 knutepunktene.","Votre mission : les premiers combats auront lieu à ces 4 carrefours."],
["The Temple opens at 40:00.","Tapınak 40:00'da açılır.","O Templo abre aos 40:00.","วิหารเปิดเวลา 40:00","사원은 40:00에 열립니다.","Świątynia otwiera się o 40:00.","Tempelet åpner kl. 40:00.","Le Temple ouvre à 40:00."],
["It gives 1,800 points per minute and holds a captain.","Dakikada 1.800 puan verir ve bir kaptan barındırır.","Ele dá 1.800 pontos por minuto e comporta um capitão.","ให้ 1,800 คะแนนต่อนาทีและมีกัปตันประจำ","분당 1,800점을 제공하며 대장이 배치됩니다.","Zapewnia 1800 punktów na minutę i mieści dowódcę.","Det gir 1 800 poeng i minuttet og har plass til en kaptein.","Il rapporte 1 800 points par minute et accueille un capitaine."],
["The occupier at the end gains abundant points.","Süre sonunda Tapınak'ı elinde tutan çok puan kazanır.","Quem estiver ocupando no final ganha muitos pontos.","เมื่อจบการแข่งขัน ผู้ครองวิหารจะได้รับคะแนนจำนวนมาก","종료 시 점령하고 있는 진영은 많은 점수를 얻습니다.","Strona, która będzie ją zajmować na koniec, zdobędzie mnóstwo punktów.","Den som holder tempelet ved kampslutt, får mange poeng.","Le camp qui le contrôle à la fin gagne beaucoup de points."],
["We reach it only through {X}30 and {X}31.","Oraya yalnızca {X}30 ve {X}31 üzerinden ulaşabiliriz.","Só chegamos lá por {X}30 e {X}31.","เราไปถึงได้ผ่าน {X}30 และ {X}31 เท่านั้น","{X}30과 {X}31을 통해서만 사원에 갈 수 있습니다.","Możemy się tam dostać tylko przez {X}30 i {X}31.","Vi kommer bare dit via {X}30 og {X}31.","Nous ne pouvons l’atteindre que par {X}30 et {X}31."],
["Whoever kills the last NPC guard holds the Temple until someone defeats them.","Son NPC muhafızını öldüren, yenilene kadar Tapınak'ı elinde tutar.","Quem derrotar o último guarda NPC fica com o Templo até ser derrotado.","ผู้ที่กำจัดทหาร NPC คนสุดท้ายจะครองวิหารจนกว่าจะถูกโค่น","마지막 NPC 경비병을 처치한 진영이 패배할 때까지 사원을 점령합니다.","Kto pokona ostatniego strażnika NPC, zajmuje Świątynię, dopóki ktoś go nie pokona.","Den som beseirer den siste NPC-vakten, holder tempelet til noen beseirer dem.","Le camp qui élimine le dernier garde PNJ contrôle le Temple jusqu’à ce qu’il soit vaincu."],
["Moving, capturing, attacking, retreating, healing and reviving cost energy.","Hareket etmek, ele geçirmek, saldırmak, geri çekilmek, iyileşmek ve dirilmek enerji harcar.","Mover, capturar, atacar, recuar, curar e reviver gastam energia.","การเคลื่อนที่ ยึดพื้นที่ โจมตี ถอย รักษา และชุบชีวิตใช้พลังงาน","이동, 점령, 공격, 후퇴, 치료, 부활에는 에너지가 소모됩니다.","Ruch, przejmowanie, atak, odwrót, leczenie i wskrzeszanie kosztują energię.","Forflytning, erobring, angrep, retrett, helbredelse og gjenoppliving koster energi.","Les déplacements, captures, attaques, retraites, soins et réanimations coûtent de l’énergie."],
["The farther you march, the more energy it costs.","Sefer mesafesi uzadıkça daha fazla enerji harcanır.","Quanto mais longe você marchar, mais energia será consumida.","ยิ่งเดินทัพไกล ก็ยิ่งใช้พลังงานมาก","행군 거리가 멀수록 에너지가 더 많이 듭니다.","Im dalej maszerujesz, tym więcej energii to kosztuje.","Jo lenger du marsjerer, desto mer energi koster det.","Plus votre marche est longue, plus elle coûte de l’énergie."],
["Try to spend it on goals, not random fights.","Enerjinizi rastgele savaşlara değil, hedeflere harcayın.","Use energia para alcançar objetivos, não em lutas aleatórias.","ใช้พลังงานเพื่อทำเป้าหมาย ไม่ใช่การต่อสู้ที่ไร้จุดหมาย","무작위 전투보다 목표를 위해 에너지를 사용하세요.","Wykorzystuj energię na cele, a nie przypadkowe walki.","Bruk energien på mål, ikke tilfeldige kamper.","Dépensez votre énergie pour atteindre des objectifs, pas dans des combats inutiles."],
["Wounded? Use Conscript to heal. It costs energy. Use it in a building nobody is fighting for.\nMarch fully defeated? Wait for the cooldown, or spend energy to bring it back instantly.","Yaralı mısınız? İyileşmek için Askere Alma'yı kullanın; enerji harcar. Kimsenin savaşmadığı bir binada kullanın.\nSefer tamamen yenildi mi? Bekleme süresinin dolmasını bekleyin veya hemen döndürmek için enerji harcayın.","Ferido? Use Conscrito para curar. Custa energia. Use em uma construção pela qual ninguém esteja lutando.\nMarcha totalmente derrotada? Aguarde o tempo de recarga ou gaste energia para trazê-la de volta imediatamente.","บาดเจ็บหรือไม่ ใช้เกณฑ์ทหารเพื่อรักษา ซึ่งใช้พลังงาน ควรใช้ในอาคารที่ไม่มีการต่อสู้\nกองทัพพ่ายแพ้ทั้งหมดหรือไม่ รอคูลดาวน์หรือใช้พลังงานเพื่อให้กลับมาทันที","부상당했나요? 징집을 사용해 치료하세요. 에너지가 들므로 아무도 싸우지 않는 건물에서 사용하세요.\n행군 부대가 완전히 패배했나요? 재사용 대기시간을 기다리거나 에너지를 써서 즉시 복귀시키세요.","Ranni? Użyj Poboru, aby ich wyleczyć. Kosztuje to energię. Używaj go w budynku, o który nikt nie walczy.\nMarsz całkowicie pokonany? Poczekaj na koniec odnowienia albo wydaj energię, by natychmiast go przywrócić.","Skadet? Bruk verneplikt for å helbrede. Det koster energi. Bruk det i en bygning ingen kjemper om.\nEr marsjen helt beseiret? Vent på nedkjølingen, eller bruk energi for å få den tilbake umiddelbart.","Blessé ? Utilisez la Conscription pour vous soigner. Cela coûte de l’énergie. Utilisez-la dans un bâtiment que personne ne dispute.\nMarche entièrement vaincue ? Attendez la fin du délai de récupération ou dépensez de l’énergie pour la rétablir immédiatement."],
["[Leader] give captain slots to the strongest and most active players, tiered by activity, strength and lack of energy.","[Leader], kaptan yuvalarını etkinlik, güç ve enerji durumuna göre en güçlü ve aktif oyunculara verin.","[Leader], distribua as vagas de capitão aos jogadores mais fortes e ativos, considerando atividade, força e falta de energia.","[Leader] มอบตำแหน่งกัปตันให้ผู้เล่นที่แข็งแกร่งและแอคทีฟ โดยพิจารณาจากกิจกรรม ความแข็งแกร่ง และพลังงานที่เหลือ","[Leader]는 활동량, 전투력, 에너지 부족 정도를 고려해 가장 강하고 활발한 플레이어에게 대장 자리를 배정하세요.","[Leader] przydziela miejsca dowódców najsilniejszym i najbardziej aktywnym graczom, biorąc pod uwagę aktywność, siłę i niski poziom energii.","[Leader] gir kapteinsplassene til de sterkeste og mest aktive spillerne, basert på aktivitet, styrke og lite energi.","[Leader] attribue les emplacements de capitaine aux joueurs les plus forts et actifs, selon leur activité, leur puissance et leur niveau d’énergie."],
["Suggestion: keep 30–40% energy for the 20:00 mark.","Öneri: 20:00 için enerjinizin %30–40'ını saklayın.","Sugestão: guarde 30–40% de energia para os 20:00.","คำแนะนำ: เก็บพลังงานไว้ 30–40% สำหรับเวลา 20:00","제안: 20:00 시점에 대비해 에너지 30~40%를 남겨두세요.","Wskazówka: zachowaj 30–40% energii na 20:00.","Tips: spar 30–40 % energi til kl. 20:00.","Conseil : gardez 30 à 40 % d’énergie pour 20:00."],
["Your job: manage your own energy.","Göreviniz: kendi enerjinizi yönetin.","Sua tarefa: gerencie sua própria energia.","หน้าที่ของคุณ: บริหารพลังงานของตัวเอง","임무: 에너지를 직접 관리하세요.","Twoje zadanie: zarządzaj własną energią.","Din oppgave: administrer din egen energi.","Votre mission : gérez votre énergie."],
["You have 3 marches, 3 heroes each. Strongest heroes in March 1, then March 2, then March 3.\nTroops: 50/20/30, or 60/20/20 to hold a Garrison.","3 seferiniz ve her birinde 3 kahramanınız var. En güçlü kahramanları 1. sefere, sonrakileri 2. ve 3. sefere koyun.\nBirlikler: 50/20/30; Garnizon tutmak için 60/20/20.","Você tem 3 marchas, com 3 heróis cada. Coloque os heróis mais fortes na Marcha 1, depois na 2 e na 3.\nTropas: 50/20/30 ou 60/20/20 para segurar uma Guarnição.","คุณมีกองทัพ 3 กอง แต่ละกองมีฮีโร่ 3 คน ใส่ฮีโร่ที่แข็งแกร่งที่สุดในกองที่ 1 รองลงมาในกองที่ 2 และ 3\nทหาร: 50/20/30 หรือ 60/20/20 เพื่อยึดกองรักษาการณ์","행군 부대 3개가 있고 각 부대에 영웅 3명이 있습니다. 가장 강한 영웅을 1번에, 다음 영웅을 2번과 3번에 배치하세요.\n병력 비율: 50/20/30, 주둔지 방어는 60/20/20.","Masz 3 marsze, po 3 bohaterów w każdym. Najsilniejszych bohaterów ustaw w Marszu 1, kolejnych w Marszu 2, a pozostałych w Marszu 3.\nOddziały: 50/20/30 lub 60/20/20 do obrony Garnizonu.","Du har 3 marsjer med 3 helter hver. Sett de sterkeste heltene i Marsj 1, deretter Marsj 2 og Marsj 3.\nSoldater: 50/20/30, eller 60/20/20 for å holde en garnison.","Vous avez 3 marches de 3 héros chacune. Placez vos héros les plus puissants dans la marche 1, puis dans les marches 2 et 3.\nTroupes : 50/20/30, ou 60/20/20 pour tenir une Garnison."],
["Buffs: combat buffs work. Capacity, march speed and rally buffs don’t.","버프: 전투 버프는 적용됩니다. 수용량, 행군 속도, 집결 버프는 적용되지 않습니다.","Bônus: bônus de combate funcionam. Bônus de capacidade, velocidade de marcha e rally não funcionam.","บัฟ: บัฟการต่อสู้ใช้ได้ แต่บัฟความจุ ความเร็วเดินทัพ และการรวมพลใช้ไม่ได้","버프: 전투 버프는 적용됩니다. 수용량, 행군 속도, 집결 버프는 적용되지 않습니다.","Wzmocnienia: działają wzmocnienia bojowe. Wzmocnienia pojemności, szybkości marszu i zbiórki nie działają.","Forsterkninger: kampforsterkninger fungerer. Forsterkninger for kapasitet, marsjfart og samling fungerer ikke.","Bonus : les bonus de combat fonctionnent. Ceux de capacité, de vitesse de marche et de ralliement ne fonctionnent pas."],
["Skip Diana and Blue heroes.\nSet your presets before the battle starts.","Diana ve Mavi kahramanları kullanmayın.\nSavaş başlamadan dizilimlerinizi ayarlayın.","Não use Diana nem heróis Azuis.\nConfigure suas formações antes do início da batalha.","ไม่ใช้ Diana และฮีโร่สีน้ำเงิน\nตั้งค่าชุดกองทัพไว้ก่อนเริ่มการต่อสู้","다이애나와 파란색 영웅은 제외하세요.\n전투 시작 전에 프리셋을 설정하세요.","Pomiń Dianę i niebieskich bohaterów.\nUstaw formacje przed rozpoczęciem bitwy.","Dropp Diana og blå helter.\nSett opp lagene dine før kampen starter.","Évitez Diana et les héros bleus.\nPréparez vos formations avant le début du combat."],
["Our buildings have NPC guards. Enemies must kill them first.","Binalarımızı NPC muhafızlar korur. Düşmanların önce onları yenmesi gerekir.","Nossas construções têm guardas NPC. Os inimigos precisam derrotá-los primeiro.","อาคารของเรามีทหาร NPC คุ้มกัน ศัตรูต้องกำจัดพวกเขาก่อน","우리 건물에는 NPC 경비병이 있습니다. 적은 먼저 경비병을 처치해야 합니다.","Nasze budynki mają strażników NPC. Wrogowie muszą najpierw ich pokonać.","NPC-vakter beskytter bygningene våre. Fienden må beseire dem først.","Des gardes PNJ protègent nos bâtiments. Les ennemis doivent d’abord les éliminer."],
["Until the NPCs die, you can still send marches into the building.","NPC'ler ölmeden binaya sefer gönderebilirsiniz.","Enquanto os NPCs estiverem vivos, ainda é possível enviar marchas para a construção.","ตราบใดที่ NPC ยังไม่ตาย คุณยังส่งกองทัพเข้าอาคารได้","NPC가 처치되기 전까지는 건물로 행군 부대를 보낼 수 있습니다.","Dopóki NPC żyją, możesz wysyłać marsze do budynku.","Så lenge NPC-ene lever, kan du fortsatt sende marsjer inn i bygningen.","Tant que les PNJ sont en vie, vous pouvez encore envoyer des marches dans le bâtiment."],
["Once they die, the building is theirs. We must fight to take it back.","NPC'ler ölünce bina düşmana geçer. Geri almak için savaşmalıyız.","Quando eles morrem, a construção passa a ser deles. Precisamos lutar para retomá-la.","เมื่อ NPC ตาย อาคารจะเป็นของศัตรู เราต้องต่อสู้เพื่อยึดคืน","NPC가 처치되면 건물은 적의 소유가 됩니다. 되찾으려면 싸워야 합니다.","Gdy zginą, budynek należy do wroga. Musimy walczyć, aby go odzyskać.","Når de dør, tilhører bygningen fienden. Vi må kjempe for å ta den tilbake.","Une fois les PNJ éliminés, le bâtiment appartient à l’ennemi. Nous devons le reprendre par la force."],
["NPCs alive when you arrive? Go in. NPCs dead? Stage first, then retake.","Vardığınızda NPC'ler hayattaysa içeri girin. Ölmüşlerse önce konuşlanın, sonra geri alın.","NPCs vivos ao chegar? Entre. NPCs mortos? Posicione-se primeiro e depois retome.","เมื่อไปถึง NPC ยังมีชีวิตหรือไม่ ถ้ายังอยู่ให้เข้าไป หากตายแล้ว ให้ตั้งหลักก่อนแล้วยึดคืน","도착했을 때 NPC가 살아 있나요? 진입하세요. 처치됐나요? 먼저 대기한 뒤 탈환하세요.","NPC żyją, gdy docierasz? Wchodź. NPC nie żyją? Najpierw zajmij pozycję, a potem odbij budynek.","Lever NPC-ene når du kommer fram? Gå inn. Er de døde? Still opp først, og ta bygningen tilbake etterpå.","PNJ encore en vie à votre arrivée ? Entrez. PNJ éliminés ? Positionnez-vous d’abord, puis reprenez le bâtiment."],
["A march’s destination is locked once you send it. Long marches can arrive too late.","Bir seferi gönderdiğinizde hedefi değiştirilemez. Uzun seferler geç kalabilir.","O destino de uma marcha fica travado após o envio. Marchas longas podem chegar tarde demais.","เมื่อส่งกองทัพแล้วจะเปลี่ยนจุดหมายไม่ได้ การเดินทางไกลอาจไปถึงช้าเกินไป","행군을 보내면 목적지를 바꿀 수 없습니다. 거리가 멀면 너무 늦게 도착할 수 있습니다.","Po wysłaniu marszu jego cel jest zablokowany. Długie marsze mogą dotrzeć za późno.","Målet for en marsj låses når du sender den. Lange marsjer kan komme fram for sent.","Une fois envoyée, une marche ne peut plus changer de destination. Les marches longues risquent d’arriver trop tard."],
["Stage first: go to the node before the fight, then move in.","Önce konuşlanın: savaştan önce düğüme gidin, ardından içeri ilerleyin.","Posicione-se primeiro: vá ao ponto antes da luta e depois avance.","ตั้งหลักก่อน: ไปยังจุดก่อนเริ่มการต่อสู้ แล้วค่อยเคลื่อนเข้าไป","먼저 대기하세요: 전투 전에 거점으로 이동한 다음 진입하세요.","Najpierw zajmij pozycję: przejdź do węzła przed walką, a potem ruszaj dalej.","Still opp først: gå til punktet før kampen, og rykk deretter inn.","Positionnez-vous d’abord : rejoignez le point avant le combat, puis avancez."],
["A defeated march respawns at your HQ ({X}1) and walks from there.","Yenilen sefer karargâhınızda ({X}1) yeniden doğar ve oradan yürür.","Uma marcha derrotada reaparece no seu QG ({X}1) e parte de lá.","กองทัพที่พ่ายแพ้จะเกิดใหม่ที่กองบัญชาการ ({X}1) แล้วเดินทางต่อจากที่นั่น","패배한 행군 부대는 본부 ({X}1)에서 부활해 다시 출발합니다.","Pokonany marsz odradza się w twojej Kwaterze głównej ({X}1) i stamtąd rusza dalej.","En beseiret marsj gjenoppstår ved hovedkvarteret ditt ({X}1) og fortsetter derfra.","Une marche vaincue réapparaît à votre QG ({X}1) et repart de là."],
["0–3 min. Check your role and your route.","0–3 dk. Rolünüzü ve rotanızı kontrol edin.","0–3 min. Confira sua função e sua rota.","0–3 นาที ตรวจสอบบทบาทและเส้นทางของคุณ","0~3분. 역할과 경로를 확인하세요.","0–3 min. Sprawdź swoją rolę i trasę.","0–3 min. Sjekk rollen og ruten din.","0–3 min. Vérifiez votre rôle et votre itinéraire."],
["Check that your 3 presets are ready.","3 diziliminizin hazır olduğunu kontrol edin.","Confira se suas 3 formações estão prontas.","ตรวจสอบว่าชุดกองทัพทั้ง 3 พร้อมแล้ว","프리셋 3개가 준비됐는지 확인하세요.","Sprawdź, czy wszystkie 3 formacje są gotowe.","Sjekk at de 3 lagoppsettene dine er klare.","Vérifiez que vos 3 formations sont prêtes."],
["Use pet buffs and consumables right before the start.","Başlamadan hemen önce evcil hayvan güçlendirmelerini ve tüketilebilirleri kullanın.","Use os bônus de mascote e consumíveis logo antes do início.","ใช้บัฟสัตว์เลี้ยงและไอเทมใช้แล้วหมดไปก่อนเริ่ม","시작 직전에 펫 버프와 소모품을 사용하세요.","Tuż przed rozpoczęciem użyj wzmocnień zwierzaka i przedmiotów jednorazowych.","Bruk kjæledyrforsterkninger og forbruksvarer rett før start.","Utilisez les bonus de familier et les consommables juste avant le début."],
["Your job: be ready when the clock hits 3:00.","Göreviniz: saat 3:00 olduğunda hazır olmak.","Sua tarefa: esteja pronto quando o relógio chegar a 3:00.","หน้าที่ของคุณ: เตรียมพร้อมเมื่อเวลาถึง 3:00","임무: 시간이 3:00이 되면 준비를 마치세요.","Twoje zadanie: bądź gotowy, gdy zegar pokaże 3:00.","Din oppgave: vær klar når klokken viser 3:00.","Votre mission : soyez prêt quand le compte à rebours atteint 3:00."],
["3–20 min. Take all our nodes. Clusters (600) before Ruins (180).","3–20 dk. Tüm düğümlerimizi ele geçirin. Önce Harabe kümeleri (600), sonra Harabeler (180).","3–20 min. Conquiste todos os nossos pontos. Conjuntos (600) antes das Ruínas (180).","3–20 นาที ยึดจุดของเราให้ครบ ยึดกลุ่มซาก (600) ก่อนซาก (180)","3~20분. 우리 거점을 모두 점령하세요. 폐허(180)보다 군집(600)을 먼저 점령하세요.","3–20 min. Zajmij wszystkie nasze węzły. Najpierw skupiska (600), potem Ruiny (180).","3–20 min. Ta alle punktene våre. Ruinområder (600) før ruiner (180).","3–20 min. Prenez tous nos points. Priorité aux groupes de ruines (600), puis aux ruines (180)."],
["[Attack]: take the right-side nodes, then push through {X}18 and {X}31.\n[Defense]: take the left-side nodes and hold {X}19 and {X}30.\n[Floater]: take the center and back nodes, then fill gaps.\n[Leader]: assign energy and make the calls.","[Attack]: sağ taraftaki düğümleri alın, sonra {X}18 ve {X}31 üzerinden ilerleyin.\n[Defense]: sol taraftaki düğümleri alın; {X}19 ve {X}30'u tutun.\n[Floater]: orta ve arka düğümleri alın, sonra boşlukları doldurun.\n[Leader]: enerjiyi dağıtın ve çağrıları yapın.","[Attack]: conquiste os pontos da direita e avance por {X}18 e {X}31.\n[Defense]: conquiste os pontos da esquerda e segure {X}19 e {X}30.\n[Floater]: conquiste os pontos centrais e traseiros e cubra as brechas.\n[Leader]: distribua energia e coordene as chamadas.","[Attack]: ยึดจุดด้านขวา แล้วบุกผ่าน {X}18 และ {X}31\n[Defense]: ยึดจุดด้านซ้ายและป้องกัน {X}19 กับ {X}30\n[Floater]: ยึดจุดกลางและด้านหลัง แล้วเติมช่องว่าง\n[Leader]: จัดสรรพลังงานและสั่งการ","[Attack]: 오른쪽 거점을 점령한 뒤 {X}18과 {X}31을 통해 진격하세요.\n[Defense]: 왼쪽 거점을 점령하고 {X}19와 {X}30을 지키세요.\n[Floater]: 중앙과 후방 거점을 점령한 뒤 빈 곳을 지원하세요.\n[Leader]: 에너지를 배분하고 지시를 내리세요.","[Attack]: zajmij węzły po prawej, a potem rusz przez {X}18 i {X}31.\n[Defense]: zajmij węzły po lewej i utrzymaj {X}19 oraz {X}30.\n[Floater]: zajmij węzły w środku i z tyłu, a potem uzupełnij luki.\n[Leader]: przydzielaj energię i wydawaj polecenia.","[Attack]: ta punktene på høyre side, og rykk deretter fram via {X}18 og {X}31.\n[Defense]: ta punktene på venstre side og hold {X}19 og {X}30.\n[Floater]: ta punktene i midten og bak, og fyll deretter hullene.\n[Leader]: fordel energi og gi beskjedene.","[Attack] : prenez les points à droite, puis avancez par {X}18 et {X}31.\n[Defense] : prenez les points à gauche et tenez {X}19 et {X}30.\n[Floater] : prenez les points du centre et de l’arrière, puis comblez les trous.\n[Leader] : répartissez l’énergie et donnez les consignes."],
["Why push right? Hits on {Y}’s other hubs split their reinforcements before the Garrison opens.","왜 오른쪽으로 진격하나요? {Y}의 다른 거점을 공격하면 주둔지가 열리기 전에 적의 지원군을 분산시킬 수 있습니다.","Por que avançar pela direita? Atacar os outros centros de {Y} divide os reforços antes de a Guarnição abrir.","ทำไมต้องบุกทางขวา การโจมตีศูนย์อื่นของ {Y} จะทำให้กำลังเสริมแยกตัวก่อนกองรักษาการณ์เปิด","왜 오른쪽으로 진격하나요? {Y}의 다른 거점을 공격하면 주둔지가 열리기 전에 적 지원군을 분산시킵니다.","Dlaczego atakować prawą stronę? Atak na pozostałe węzły {Y} rozdzieli ich posiłki, zanim otworzy się Garnizon.","Hvorfor rykke fram til høyre? Angrep på de andre knutepunktene til {Y} sprer forsterkningene deres før garnisonen åpner.","Pourquoi avancer à droite ? Attaquer les autres carrefours de {Y} disperse leurs renforts avant l’ouverture de la Garnison."],
["Garrisons are locked. Save energy for 20:00.","Garnizonlar kilitli. 20:00 için enerji saklayın.","As guarnições estão bloqueadas. Guarde energia para 20:00.","กองรักษาการณ์ยังล็อกอยู่ เก็บพลังงานไว้สำหรับ 20:00","주둔지는 잠겨 있습니다. 20:00에 대비해 에너지를 아끼세요.","Garnizony są zablokowane. Zachowaj energię na 20:00.","Garnisonene er låst. Spar energi til kl. 20:00.","Les garnisons sont verrouillées. Gardez de l’énergie pour 20:00."],
["About 18:30. [Leader] tag two handpicked squads. Everyone else keeps their role.","Yaklaşık 18:30. [Leader] seçilen iki birliği etiketlesin. Diğer herkes rolünü korusun.","Por volta de 18:30. [Leader], marque dois esquadrões escolhidos. Todos os outros mantêm suas funções.","ประมาณ 18:30 [Leader] ติดแท็กให้สองทีมที่เลือกไว้ คนอื่นคงบทบาทเดิม","18:30쯤 [Leader]가 선발된 부대 2개를 지정합니다. 나머지는 기존 역할을 유지하세요.","Około 18:30. [Leader] oznacza dwa wybrane oddziały. Pozostali zachowują swoje role.","Rundt kl. 18:30. [Leader] merker to utvalgte lag. Alle andre beholder rollen sin.","Vers 18:30. [Leader], désignez deux escouades choisies. Les autres gardent leur rôle."],
["[Defense]: stage next to {X}24, ready for 20:00.","[Defense]: 20:00'ye hazır olmak için {X}24'ün yanında konuşlanın.","[Defense]: posicione-se ao lado de {X}24, pronto para as 20:00.","[Defense]: ตั้งหลักข้าง {X}24 เพื่อเตรียมพร้อมเวลา 20:00","[Defense]: 20:00에 대비해 {X}24 옆에서 대기하세요.","[Defense]: zajmij pozycję obok {X}24 i przygotuj się na 20:00.","[Defense]: still opp ved {X}24, klar til kl. 20:00.","[Defense] : positionnez-vous près de {X}24 pour être prêt à 20:00."],
["[Attack]: stage at {Y}28, next to {Y}24.","[Attack]: {Y}24'ün yanındaki {Y}28'de konuşlanın.","[Attack]: posicione-se em {Y}28, ao lado de {Y}24.","[Attack]: ตั้งหลักที่ {Y}28 ข้าง {Y}24","[Attack]: {Y}24 옆의 {Y}28에서 대기하세요.","[Attack]: zajmij pozycję przy {Y}28, obok {Y}24.","[Attack]: still opp ved {Y}28, ved siden av {Y}24.","[Attack] : positionnez-vous à {Y}28, près de {Y}24."],
["20:00. [Defense]: take {X}24 first, then {X}28.","20:00. [Defense]: önce {X}24'ü, sonra {X}28'i alın.","20:00. [Defense]: conquiste {X}24 primeiro e depois {X}28.","20:00 [Defense]: ยึด {X}24 ก่อน แล้วจึงยึด {X}28","20:00. [Defense]: 먼저 {X}24를 점령한 다음 {X}28을 점령하세요.","20:00. [Defense]: najpierw zajmij {X}24, a potem {X}28.","20:00. [Defense]: ta {X}24 først, deretter {X}28.","20:00. [Defense] : prenez d’abord {X}24, puis {X}28."],
["20:00. [Attack]: push for {Y}24.","20:00. [Attack]: {Y}24'e ilerleyin.","20:00. [Attack]: avance para {Y}24.","20:00 [Attack]: บุกไปยัง {Y}24","20:00. [Attack]: {Y}24로 진격하세요.","20:00. [Attack]: ruszaj na {Y}24.","20:00. [Attack]: rykk fram mot {Y}24.","20:00. [Attack] : foncez vers {Y}24."],
["Don't be late. {Z} will be in {X}28 at 20:00. Being late might cost the Garrison.","Geç kalmayın. {Z}, 20:00'de {X}28'de olacak. Geç kalmak Garnizon'a mal olabilir.","Não se atrase. {Z} estará em {X}28 às 20:00. Chegar tarde pode custar a Guarnição.","อย่ามาสาย {Z} จะอยู่ที่ {X}28 เวลา 20:00 การมาช้าอาจทำให้เสียกองรักษาการณ์","늦지 마세요. {Z}는 20:00에 {X}28에 도착합니다. 늦으면 주둔지를 빼앗길 수 있습니다.","Nie spóźnij się. O 20:00 {Z} będzie przy {X}28. Spóźnienie może kosztować nas Garnizon.","Ikke kom for sent. {Z} vil være ved {X}28 kl. 20:00. Hvis du kommer for sent, kan vi miste garnisonen.","Ne soyez pas en retard. {Z} sera à {X}28 à 20:00. Un retard peut nous coûter la Garnison."],
["Hold {X}24 and {X}28. The Garrison gives 1,800 points per minute.","{X}24 ve {X}28'i tutun. Garnizon dakikada 1.800 puan verir.","Segure {X}24 e {X}28. A Guarnição dá 1.800 pontos por minuto.","ป้องกัน {X}24 และ {X}28 กองรักษาการณ์ให้ 1,800 คะแนนต่อนาที","{X}24와 {X}28을 지키세요. 주둔지는 분당 1,800점을 제공합니다.","Utrzymaj {X}24 i {X}28. Garnizon daje 1800 punktów na minutę.","Hold {X}24 og {X}28. Garnisonen gir 1 800 poeng i minuttet.","Tenez {X}24 et {X}28. La Garnison rapporte 1 800 points par minute."],
["[Defense]: keep all 6 hubs ours and retake any that flip.\n[Attack]: keep pressure through all 3 hubs toward {Y}.\n[Floater]: retake hubs and cover buildings the Attackers pass.","[Defense]: 6 merkezin tamamını elimizde tutun; düşenleri geri alın.\n[Attack]: {Y} yönündeki 3 merkezin tamamında baskıyı sürdürün.\n[Floater]: merkezleri geri alın ve saldırı birliklerinin geçtiği binaları destekleyin.","[Defense]: mantenha nossos 6 centros e retome os que forem perdidos.\n[Attack]: pressione {Y} pelos 3 centros.\n[Floater]: retome centros e cubra as construções por onde os atacantes passarem.","[Defense]: รักษาศูนย์ทั้ง 6 แห่งไว้และยึดคืนจุดที่เสียไป\n[Attack]: กดดันไปยัง {Y} ผ่านศูนย์ทั้ง 3\n[Floater]: ยึดศูนย์คืนและช่วยป้องกันอาคารที่ทีมโจมตีผ่าน","[Defense]: 거점 6곳을 모두 지키고 빼앗긴 곳은 탈환하세요.\n[Attack]: 거점 3곳을 통해 {Y}를 계속 압박하세요.\n[Floater]: 거점을 탈환하고 공격 부대가 지나가는 건물을 지원하세요.","[Defense]: utrzymaj wszystkie 6 węzłów i odbij te, które stracimy.\n[Attack]: nacieraj przez wszystkie 3 węzły w kierunku {Y}.\n[Floater]: odbijaj węzły i osłaniaj budynki mijane przez Attack.","[Defense]: hold alle 6 knutepunktene våre og ta tilbake dem vi mister.\n[Attack]: hold presset mot {Y} gjennom alle 3 knutepunktene.\n[Floater]: ta tilbake knutepunkter og støtt bygningene Attack passerer.","[Defense] : gardez nos 6 carrefours et reprenez ceux que nous perdons.\n[Attack] : maintenez la pression vers {Y} par les 3 carrefours.\n[Floater] : reprenez les carrefours et protégez les bâtiments traversés par Attack."],
["If {Y} pressures {X}18, {X}27 or {X}31, [Leader] call [Defense] to the right.","{Y}, {X}18, {X}27 veya {X}31'e baskı yaparsa [Leader], [Defense]'i sağ tarafa çağırın.","Se {Y} pressionar {X}18, {X}27 ou {X}31, [Leader], chame [Defense] para a direita.","หาก {Y} กดดัน {X}18, {X}27 หรือ {X}31 [Leader] ให้เรียก [Defense] ไปทางขวา","{Y}가 {X}18, {X}27, {X}31을 압박하면 [Leader]는 오른쪽에 [Defense]를 호출하세요.","Jeśli {Y} naciska na {X}18, {X}27 lub {X}31, [Leader] skieruj [Defense] na prawą stronę.","Hvis {Y} presser {X}18, {X}27 eller {X}31, [Leader] send [Defense] til høyre side.","Si {Y} met la pression sur {X}18, {X}27 ou {X}31, [Leader], envoyez [Defense] à droite."],
["Expand only while the hub you crossed stays ours.","Yalnızca geçtiğiniz merkez elimizde kaldığı sürece ilerleyin.","Avance somente enquanto o centro atravessado continuar sob nosso controle.","ขยายแนวรบต่อเมื่อศูนย์ที่คุณผ่านยังเป็นของเรา","지나온 거점이 우리 소유일 때만 진격하세요.","Rozszerzaj natarcie tylko wtedy, gdy węzeł, przez który przechodzisz, pozostaje nasz.","Utvid bare så lenge knutepunktet du passerte fortsatt er vårt.","N’étendez votre avancée que tant que le carrefour franchi reste sous notre contrôle."],
["About 36 min. Heal your troops.","Yaklaşık 36. dakika. Birliklerinizi iyileştirin.","Por volta dos 36 min. Cure suas tropas.","ประมาณนาทีที่ 36 รักษาทหารของคุณ","36분쯤 병력을 치료하세요.","Około 36. minuty. Wylecz swoje oddziały.","Rundt 36 minutter. Helbred troppene dine.","Vers 36 min. Soignez vos troupes."],
["[Defense]: make sure every hub is ours. {X}30 and {X}31 matter most.\n[Attack]: keep your role.","[Defense]: tüm merkezlerin bizde olduğundan emin olun. En önemlileri {X}30 ve {X}31.\n[Attack]: rolünüzü sürdürün.","[Defense]: garanta que todos os centros sejam nossos. {X}30 e {X}31 são os mais importantes.\n[Attack]: mantenha sua função.","[Defense]: ตรวจสอบให้แน่ใจว่าศูนย์ทุกแห่งเป็นของเรา โดย {X}30 และ {X}31 สำคัญที่สุด\n[Attack]: คงบทบาทเดิม","[Defense]: 모든 거점이 우리 소유인지 확인하세요. {X}30과 {X}31이 가장 중요합니다.\n[Attack]: 역할을 유지하세요.","[Defense]: upewnij się, że wszystkie węzły są nasze. Najważniejsze są {X}30 i {X}31.\n[Attack]: trzymaj się swojej roli.","[Defense]: sørg for at alle knutepunktene er våre. {X}30 og {X}31 er viktigst.\n[Attack]: fortsett i rollen din.","[Defense] : assurez-vous que tous les carrefours sont à nous. {X}30 et {X}31 sont les plus importants.\n[Attack] : gardez votre rôle."],
["[Leader] tag a handpicked Temple squad from the [Attack] teams. Everyone else keeps their role.","[Leader], [Attack] ekiplerinden seçilen Tapınak birliğini etiketleyin. Diğer herkes rolünü korusun.","[Leader], marque um esquadrão escolhido das equipes de [Attack] para o Templo. Todos os outros mantêm suas funções.","[Leader] ติดแท็กทีมวิหารที่เลือกจากทีม [Attack] คนอื่นคงบทบาทเดิม","[Leader]는 [Attack] 팀에서 선발된 사원 부대를 지정하세요. 나머지는 기존 역할을 유지하세요.","[Leader] oznacz wybrany oddział Świątyni z drużyn [Attack]. Pozostali zachowują swoje role.","[Leader] merk et utvalgt tempellag fra [Attack]-lagene. Alle andre beholder rollen sin.","[Leader], désignez une escouade du Temple parmi les équipes [Attack]. Les autres gardent leur rôle."],
["Temple squad: move to {X}30 and {X}31.","Tapınak birliği: {X}30 ve {X}31'e ilerleyin.","Esquadrão do Templo: vá para {X}30 e {X}31.","ทีมวิหาร: เคลื่อนที่ไปยัง {X}30 และ {X}31","사원 부대: {X}30과 {X}31로 이동하세요.","Oddział Świątyni: przejdź do {X}30 i {X}31.","Tempellaget: flytt til {X}30 og {X}31.","Escouade du Temple : déplacez-vous vers {X}30 et {X}31."],
["[Defense]: protect {X}30 and {X}31. Both hubs are critical to attack temple.\n[Attack]: cut their access by hitting {Y}29 and {Z}29.","[Defense]: {X}30 ve {X}31'i koruyun. Tapınak'a saldırmak için iki merkez de kritik.\n[Attack]: {Y}29 ve {Z}29'a saldırarak düşmanın erişimini kesin.","[Defense]: proteja {X}30 e {X}31. Ambos os centros são essenciais para atacar o Templo.\n[Attack]: corte o acesso deles atacando {Y}29 e {Z}29.","[Defense]: ป้องกัน {X}30 และ {X}31 ทั้งสองศูนย์สำคัญต่อการโจมตีวิหาร\n[Attack]: ตัดทางเข้าของศัตรูโดยโจมตี {Y}29 และ {Z}29","[Defense]: {X}30과 {X}31을 지키세요. 두 거점 모두 사원 공격에 중요합니다.\n[Attack]: {Y}29와 {Z}29를 공격해 적의 진입을 차단하세요.","[Defense]: chroń {X}30 i {X}31. Oba węzły są kluczowe do ataku na Świątynię.\n[Attack]: odetnij im dostęp, atakując {Y}29 i {Z}29.","[Defense]: beskytt {X}30 og {X}31. Begge knutepunktene er avgjørende for angrep på tempelet.\n[Attack]: kutt adgangen deres ved å angripe {Y}29 og {Z}29.","[Defense] : protégez {X}30 et {X}31. Ces deux carrefours sont essentiels pour attaquer le Temple.\n[Attack] : coupez leur accès en attaquant {Y}29 et {Z}29."],
["40:00. The Temple just opened!","40:00. Tapınak açıldı!","40:00. O Templo acabou de abrir!","40:00 วิหารเปิดแล้ว!","40:00. 사원이 열렸습니다!","40:00. Świątynia właśnie się otworzyła!","40:00. Tempelet har nettopp åpnet!","40:00. Le Temple vient d’ouvrir !"],
["The Temple squad attacks through {X}30 and {X}31, strongest march first.","Tapınak birliği, en güçlü sefer önde olacak şekilde {X}30 ve {X}31 üzerinden saldırır.","O esquadrão do Templo ataca por {X}30 e {X}31, começando pela marcha mais forte.","ทีมวิหารโจมตีผ่าน {X}30 และ {X}31 โดยส่งกองทัพที่แข็งแกร่งที่สุดก่อน","사원 부대는 가장 강한 행군 부대를 먼저 보내 {X}30과 {X}31을 통해 공격하세요.","Oddział Świątyni atakuje przez {X}30 i {X}31, zaczynając od najsilniejszego marszu.","Tempellaget angriper via {X}30 og {X}31. Send den sterkeste marsjen først.","L’escouade du Temple attaque par {X}30 et {X}31, en envoyant d’abord la marche la plus puissante."],
["Some [Attack] members hit {Y}30 and {Z}31 to slow enemy Temple reinforcements.\n[Defense]: hold our hubs.\n[Floater]: reinforce where it’s needed.","[Attack] üyelerinin bir kısmı, düşmanın Tapınak takviyelerini yavaşlatmak için {Y}30 ve {Z}31'e saldırır.\n[Defense]: merkezlerimizi tutun.\n[Floater]: gereken yere takviye gönderin.","Alguns membros de [Attack] atacam {Y}30 e {Z}31 para atrasar reforços inimigos ao Templo.\n[Defense]: segure nossos centros.\n[Floater]: reforce onde for necessário.","สมาชิก [Attack] บางส่วนโจมตี {Y}30 และ {Z}31 เพื่อชะลอกำลังเสริมของศัตรูที่มุ่งสู่วิหาร\n[Defense]: ป้องกันศูนย์ของเรา\n[Floater]: เสริมกำลังในจุดที่จำเป็น","일부 [Attack]는 {Y}30과 {Z}31을 공격해 적의 사원 지원군을 늦추세요.\n[Defense]: 우리 거점을 지키세요.\n[Floater]: 필요한 곳을 지원하세요.","Część graczy [Attack] atakuje {Y}30 i {Z}31, aby spowolnić wrogie posiłki dla Świątyni.\n[Defense]: utrzymaj nasze węzły.\n[Floater]: wspieraj tam, gdzie jest to potrzebne.","Noen [Attack]-spillere angriper {Y}30 og {Z}31 for å forsinke fiendens forsterkninger til tempelet.\n[Defense]: hold knutepunktene våre.\n[Floater]: støtt der det trengs.","Certains membres de [Attack] attaquent {Y}30 et {Z}31 pour ralentir les renforts ennemis vers le Temple.\n[Defense] : tenez nos carrefours.\n[Floater] : renforcez les endroits qui en ont besoin."],
["Plan B: if the Temple looks lost, [Leader] call it. Ignore the Temple and everyone gets more aggressive.","B Planı: Tapınak kaybedilecek gibiyse [Leader] duyursun. Tapınak'ı bırakın ve herkes daha saldırgan oynasın.","Plano B: se o Templo parecer perdido, [Leader] deve avisar. Ignorem o Templo e todos avancem com mais agressividade.","แผน B: หากดูเหมือนจะเสียวิหาร ให้ [Leader] ประกาศ ไม่ต้องสนใจวิหารและทุกคนบุกให้ดุดันขึ้น","플랜 B: 사원을 잃을 것 같으면 [Leader]가 전환을 알리세요. 사원은 포기하고 모두 더 공격적으로 전환하세요.","Plan B: jeśli Świątynia jest nie do zdobycia, [Leader] ogłoś zmianę. Zignorujcie Świątynię i wszyscy przejdźcie do agresywniejszego ataku.","Plan B: Hvis tempelet ser tapt ut, [Leader] gi beskjed. Ignorer tempelet, og alle går over til en mer offensiv spillestil.","Plan B : si le Temple semble perdu, [Leader], annoncez-le. Ignorez le Temple et passez tous à l’offensive."],
["Plan B: advance through our safe buildings and attack enemy buildings.\n[Defense] should always prioritize defending our buildings and paths from any attacks.","B Planı: güvenli binalarımız üzerinden ilerleyip düşman binalarına saldırın.\n[Defense], binalarımızı ve yollarımızı saldırılara karşı her zaman öncelikli olarak korumalıdır.","Plano B: avance por nossas construções seguras e ataque as construções inimigas.\n[Defense] deve sempre priorizar a defesa das nossas construções e rotas.","แผน B: บุกผ่านอาคารที่ปลอดภัยของเราและโจมตีอาคารศัตรู\n[Defense] ควรให้ความสำคัญกับการป้องกันอาคารและเส้นทางของเราจากการโจมตีเสมอ","플랜 B: 우리 안전 건물을 거쳐 적 건물을 공격하세요.\n[Defense]는 항상 우리 건물과 경로를 공격으로부터 지키는 것을 우선해야 합니다.","Plan B: przechodź przez nasze bezpieczne budynki i atakuj wrogie.\n[Defense] zawsze powinien przede wszystkim chronić nasze budynki i drogi przed atakami.","Plan B: rykk fram via de trygge bygningene våre og angrip fiendens bygninger.\n[Defense] bør alltid prioritere å beskytte bygningene og rutene våre mot angrep.","Plan B : avancez par nos bâtiments sûrs et attaquez les bâtiments ennemis.\n[Defense] doit toujours donner la priorité à la protection de nos bâtiments et chemins."],
["[Leader] can swap back to Plan A if the Temple looks winnable.","Tapınak kazanılabilir görünüyorsa [Leader] tekrar A Planı'na dönebilir.","[Leader] pode voltar ao Plano A se parecer possível vencer no Templo.","[Leader] สามารถกลับไปแผน A ได้หากดูเหมือนว่าจะชนะที่วิหาร","사원을 차지할 가능성이 있어 보이면 [Leader]가 플랜 A로 전환할 수 있습니다.","[Leader] może wrócić do Planu A, jeśli zdobycie Świątyni znów będzie możliwe.","[Leader] kan bytte tilbake til plan A hvis det ser ut til at vi kan vinne tempelet.","[Leader] peut revenir au plan A si le Temple semble à notre portée."],
["Plan A: the last minutes decide who holds the Temple.","A Planı: son dakikalar Tapınak'ı kimin tutacağını belirler.","Plano A: os minutos finais decidem quem ficará com o Templo.","แผน A: นาทีสุดท้ายจะตัดสินว่าใครครองวิหาร","플랜 A: 마지막 몇 분이 사원의 주인을 결정합니다.","Plan A: ostatnie minuty zdecydują, kto utrzyma Świątynię.","Plan A: De siste minuttene avgjør hvem som holder tempelet.","Plan A : les dernières minutes détermineront qui contrôlera le Temple."],
["Plan A: expect pushes from every side.","A Planı: her taraftan saldırı bekleyin.","Plano A: espere avanços de todos os lados.","แผน A: เตรียมรับการบุกจากทุกฝ่าย","플랜 A: 모든 방향에서 진격해 올 수 있습니다.","Plan A: spodziewaj się ataków z każdej strony.","Plan A: forvent angrep fra alle sider.","Plan A : attendez-vous à des attaques de tous les côtés."],
["Plan B: keep taking enemy buildings through all our hubs.","B Planı: tüm merkezlerimiz üzerinden düşman binalarını ele geçirmeye devam edin.","Plano B: continue conquistando construções inimigas por todos os nossos centros.","แผน B: ยึดอาคารศัตรูต่อไปผ่านศูนย์ทั้งหมดของเรา","플랜 B: 모든 거점을 통해 계속 적 건물을 점령하세요.","Plan B: nadal zajmuj wrogie budynki, przechodząc przez wszystkie nasze węzły.","Plan B: fortsett å ta fiendens bygninger via alle knutepunktene våre.","Plan B : continuez à prendre les bâtiments ennemis en passant par tous nos carrefours."],
["Keep some energy for the final fights.","Son savaşlar için biraz enerji saklayın.","Guarde um pouco de energia para as lutas finais.","เก็บพลังงานบางส่วนไว้สำหรับการต่อสู้ช่วงท้าย","마지막 전투를 위해 에너지를 남겨두세요.","Zachowaj trochę energii na końcowe walki.","Spar litt energi til de siste kampene.","Gardez un peu d’énergie pour les derniers combats."],
["Stay until the match is complete.","Maç tamamlanana kadar kalın.","Fique até a partida terminar.","อยู่จนกว่าการแข่งขันจะจบ","경기가 끝날 때까지 남아 있으세요.","Zostań do końca meczu.","Bli til kampen er ferdig.","Restez jusqu’à la fin du match."],
["Rewards are given at the end. Leave early and you miss them.","Ödüller maç sonunda verilir. Erken ayrılırsanız onları kaçırırsınız.","As recompensas são dadas no final. Se sair antes, você perde.","รางวัลจะมอบให้ตอนจบ หากออกก่อนจะพลาดรางวัล","보상은 종료 후 지급됩니다. 일찍 나가면 보상을 받을 수 없습니다.","Nagrody są przyznawane na koniec. Jeśli wyjdziesz wcześniej, nie otrzymasz ich.","Belønningene deles ut til slutt. Går du før, går du glipp av dem.","Les récompenses sont distribuées à la fin. Si vous partez plus tôt, vous les manquerez."],

["Captures enemy buildings and pushes Garrisons and the Temple. Leaders set your role before the battle.","Düşman binalarını ele geçirir, Garnizonlara ve Tapınak'a ilerler. Rolünüzü savaştan önce liderler belirler.","Conquista construções inimigas e avança sobre Guarnições e o Templo. Os líderes definem sua função antes da batalha.","ยึดอาคารศัตรูและบุกไปยังกองรักษาการณ์กับวิหาร หัวหน้าจะกำหนดบทบาทก่อนเริ่มการต่อสู้","적 건물을 점령하고 주둔지와 사원을 향해 진격합니다. 전투 전 지휘관이 역할을 지정합니다.","Zajmuje wrogie budynki i naciera na Garnizony oraz Świątynię. Liderzy przydzielają role przed bitwą.","Tar fiendens bygninger og rykker fram mot garnisonene og tempelet. Lederne tildeler rollene før kampen.","Capture les bâtiments ennemis et avance vers les garnisons et le Temple. Les leaders attribuent les rôles avant le combat."],
["Protects our buildings and routes. Leaders set your role before the battle.","Binalarımızı ve yollarımızı korur. Rolünüzü savaştan önce liderler belirler.","Protege nossas construções e rotas. Os líderes definem sua função antes da batalha.","ปกป้องอาคารและเส้นทางของเรา หัวหน้าจะกำหนดบทบาทก่อนเริ่มการต่อสู้","우리 건물과 경로를 지킵니다. 전투 전 지휘관이 역할을 지정합니다.","Chroni nasze budynki i trasy. Liderzy przydzielają role przed bitwą.","Beskytter bygningene og rutene våre. Lederne tildeler rollene før kampen.","Protège nos bâtiments et nos itinéraires. Les leaders attribuent les rôles avant le combat."],
["Reinforces wherever needed. Leaders set your role before the battle.","Gereken yere takviye gönderir. Rolünüzü savaştan önce liderler belirler.","Reforça onde for necessário. Os líderes definem sua função antes da batalha.","เสริมกำลังในจุดที่จำเป็น หัวหน้าจะกำหนดบทบาทก่อนเริ่มการต่อสู้","필요한 곳을 지원합니다. 전투 전 지휘관이 역할을 지정합니다.","Wspiera tam, gdzie jest to potrzebne. Liderzy przydzielają role przed bitwą.","Forsterker der det trengs. Lederne tildeler rollene før kampen.","Renforce les endroits qui en ont besoin. Les leaders attribuent les rôles avant le combat."],
["R5 & R4 - Assigns energy (captains), tags squads and calls plan changes","R5 ve R4 - Enerji (kaptan) dağıtır, birlikleri etiketler ve plan değişikliklerini duyurur","R5 e R4 - Distribuem energia (capitães), marcam esquadrões e anunciam mudanças de plano","R5 และ R4 - จัดสรรพลังงาน (กัปตัน) ติดแท็กทีม และประกาศเปลี่ยนแผน","R5 및 R4 - 에너지(대장)를 배분하고 부대를 지정하며 작전 변경을 지시합니다.","R5 i R4 – przydzielają energię (dowódców), oznaczają oddziały i ogłaszają zmiany planu","R5 og R4 – fordeler energi (kapteiner), merker lag og gir beskjed om planendringer","R5 et R4 : attribuent l’énergie (capitaines), désignent les escouades et annoncent les changements de plan"],
